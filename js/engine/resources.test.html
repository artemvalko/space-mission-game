<body>
  <h1>Mission Control — self-test</h1>
  <p class="muted">Serve the project root with <code>python3 -m http.server</code> and open <code>/js/engine/resources.test.html</code>. Expected values come from docs/NASA_Hackathon_Mission_Control_Deep_Research_UA.md (BOMs §3.2/§4.3/§5.3, power §3.3/§5.4, budgets §3.5/§4.6/§5.5, QA cases §10).</p>
  <div id="summary" class="summary">Running…</div>
  <div id="out"></div>

  <script type="module">
    import { computeResources, getSelection, payloadNeeds } from './resources.js';
    import { validateDesign, hasBlockingErrors, canLaunch, gateStatus, GATES } from './validation.js';
    import { runSimulation } from './simulation.js';
    import { scoreMission, marginQuality, weightsFor, gradeFor, DISPOSAL_BONUS } from './scoring.js';
    import { evaluateObjectives, satelliteSuccess, constellationStatus, checkClaim, variantFit } from './objectives.js';
    import { describeOutcome } from './outcome.js';
    import { evaluateRoleGoals, voteStatus } from './roleGoals.js';
    import { attemptRecord } from './attempt.js';
    import { encodeDesign, decodeDesign } from '../utils/share.js';
    import { earnedBadges, BADGES } from './achievements.js';
    import { advise } from './advisor.js';
    import { goalChecklist } from './goals.js';
    import { trackPoints } from '../ui/animations/groundTrack.js';
    import { scaleAngle } from '../ui/animations/balanceScale.js';
    import { endOfLifeKind } from '../ui/animations/endOfLife.js';
    import { createInitialState, emptyDesign } from '../state/initialState.js';
    import { reducer } from '../state/reducer.js';
    import * as A from '../state/actions.js';
    import { COMPONENTS, getComponent, costFor } from '../data/components.js';
    import { INSTRUMENTS } from '../data/instruments.js';
    import { ORBITS } from '../data/orbits.js';
    import { LAUNCHERS, DEPLOYERS, getLauncher } from '../data/launchers.js';
    import { GROUND_STATIONS } from '../data/groundStations.js';
    import { SCENARIOS } from '../data/scenarios.js';
    import { REAL_MISSIONS } from '../data/realMissions.js';
    import { SOURCES, getSource } from '../data/sources.js';
    import { POWER_PACKS, KITS, bundleTotals } from '../data/bundles.js';
    import { EVENTS } from '../data/events.js';

    const out = document.getElementById('out');
    const tick = () => new Promise((r) => setTimeout(r, 0));
    let pass = 0, fail = 0;
    const el = (tag, html) => Object.assign(document.createElement(tag), { innerHTML: html });
    const esc = (t) => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;');
    const check = (label, ok, detail = '') => {
      ok ? pass++ : fail++;
      out.append(el('p', `<span class="${ok ? 'pass' : 'fail'}">${ok ? 'PASS' : 'FAIL'}</span> — ${esc(label)} <span class="muted">${esc(detail)}</span>`));
    };
    const section = (t) => out.append(el('h2', esc(t)));
    const near = (a, b, eps = 0.005) => a != null && Math.abs(a - b) <= eps;
    const errorsOf = (st) => validateDesign(st).filter((i) => i.severity === 'error');
    const gatesFailed = (st) => [...new Set(errorsOf(st).map((i) => i.gate))];

    // ── Correct builds (research §13) as plain designs
    const C = 'mission_comms_iot', N = 'mission_navigation_meo', W = 'mission_weather_mw';
    const PREP = { tests: true, licence: true, disposal: true };
    const BUILD = {
      [C]: {
        components: { structure: 'str_6u', power: 'eps_solar_6u', battery: 'battery_6u_60wh', comms: 'ttc_uhf', downlink: 'dl_sband', computer: 'obc_6u', adcs: 'adcs_6u', thermal: 'thermal_6u', sensors: 'gnss_receiver_bus', harness: 'harness_mech_6u', propulsion: 'none', propellant: 'none' },
        instrumentIds: ['payload_iot_sdr', 'ant_iot_deploy'], orbitId: 'leo_550', launcherId: 'lv_falcon9_rideshare', deployerId: 'dep_cubesat', groundId: 'gs_iot_gateways',
      },
      [W]: {
        components: { structure: 'str_6u_weather', power: 'eps_solar_6u', battery: 'battery_6u_80wh', comms: 'ttc_uhf', downlink: 'science_sband', computer: 'obc_weather', adcs: 'adcs_weather', thermal: 'thermal_weather', sensors: 'sun_orbit_sensors', harness: 'harness_misc_weather', propulsion: 'none', propellant: 'none' },
        instrumentIds: ['payload_mw_radiometer', 'radiometer_calibration'], orbitId: 'sso_550_650', launcherId: 'lv_falcon9_rideshare', deployerId: 'dep_cubesat', groundId: 'gs_weather_science',
      },
      [N]: {
        components: { structure: 'str_gnss_meo', power: 'pwr_gnss_solar', battery: 'bat_gnss_2500wh', comms: 'ttc_c_s_band', downlink: null, computer: 'obc_rad_hard', adcs: 'adcs_precision_meo', thermal: 'thermal_meo', sensors: 'none', harness: 'integration_harness_meo', propulsion: 'prop_meo_stationkeeping', propellant: 'propellant_meo' },
        instrumentIds: ['clock_phm_rubidium_4', 'nav_signal_rf', 'antenna_lband_nav'], orbitId: 'meo_gnss', launcherId: 'lv_f9_dedicated_meo', deployerId: 'dep_large_adapter', groundId: 'gs_gnss_monitoring',
      },
    };
    /** State for a mission build; `mod(design)` returns overrides. */
    function make(sid, mod = (d) => d, prep = PREP) {
      const base = BUILD[sid];
      const d = { ...emptyDesign(), ...base, components: { ...emptyDesign().components, ...base.components }, prep: { ...prep } };
      return { ...createInitialState(), scenarioId: sid, design: mod({ ...d, components: { ...d.components } }) };
    }
    const withParts = (patch) => (d) => ({ ...d, components: { ...d.components, ...patch } });
    // Answer events with the gentlest option (no damage, best service) so the run measures the design.
    const best = (ev) => { let bi = 0, bs = -1; ev.choices.forEach((c, i) => { const sc = (c.effects.damage ? -1 : 0) + (c.effects.performance ?? 1) - (c.effects.reserveShare ?? 0) * 0.01; if (sc > bs) { bs = sc; bi = i; } }); return bi; };
    const sim = (st, seed = 3, opts = {}) => runSimulation(st, seed, [], { autoChoice: best, ...opts });

    // ═══ 1. Data honesty ═══════════════════════════════════════════════════════
    section('1 · Real data only: dataKind + sources on every data item');
    {
      const sCodes = SOURCES.filter((s) => s.code.startsWith('S')); const oCodes = SOURCES.filter((s) => s.code.startsWith('O'));
      check('sources.js lists S01–S34 + O01–O56 (unique codes, URLs)', sCodes.length === 34 && oCodes.length === 56 && new Set(SOURCES.map((s) => s.code)).size === 90
        && sCodes.every((s, i) => s.code === `S${String(i + 1).padStart(2, '0')}`) && oCodes.every((s, i) => s.code === `O${String(i + 1).padStart(2, '0')}`) && SOURCES.every((s) => /^https:\/\//.test(s.url)));
      const items = [...COMPONENTS, ...INSTRUMENTS, ...ORBITS, ...LAUNCHERS, ...DEPLOYERS, ...GROUND_STATIONS, ...SCENARIOS, ...REAL_MISSIONS];
      const bad = items.filter((it) => !['fact', 'catalog', 'model', 'reported'].includes(it.dataKind) || !Array.isArray(it.sources) || it.sources.some((c) => !getSource(c)));
      check(`every data item has dataKind + valid source codes (${items.length} items)`, bad.length === 0, bad.map((b) => b.id).join(', '));
      const ex = items.filter((it) => it.realExample);
      check('real product examples are badged and sourced (kept out of the model price)', ex.length >= 4 && ex.every((it) => it.realExample.sources.length && ['fact', 'catalog'].includes(it.realExample.dataKind)), `${ex.length} examples`);
      check('no launcher carries a reliability number (§8.6)', LAUNCHERS.every((l) => !('reliability' in l)));
      check('RFQ launchers have no price (Falcon Heavy, Ariane 62, ISS deploy); Electron is 📰 reported ~$7.5M', LAUNCHERS.filter((l) => l.costType === 'rfq').map((l) => l.id).join() === 'lv_falcon_heavy,lv_ariane62,lv_iss_deploy'
        && LAUNCHERS.filter((l) => l.costType === 'rfq').every((l) => l.priceM == null) && getLauncher('lv_electron_kickstage').costType === 'reported' && getLauncher('lv_electron_kickstage').priceM === 7.5 && getLauncher('lv_electron_kickstage').dataKind === 'reported');
      check('F9 MEO package = $90M model with the $74M published GTO anchor shown', getLauncher('lv_f9_dedicated_meo').priceM === 90 && getLauncher('lv_f9_dedicated_meo').costType === 'modeled' && getLauncher('lv_f9_dedicated_meo').publishedAnchor.priceM === 74);
      check('rideshare: $350k per 50 kg + $7k/kg (published, S11)', near(getLauncher('lv_falcon9_rideshare').priceFn(8.68), 0.35) && near(getLauncher('lv_falcon9_rideshare').priceFn(60), 0.42));
      const old = ['str_compact', 'str_honeycomb', 'str_composite', 'pwr_rtg', 'com_xband', 'com_hga', 'ins_camera', 'ins_relay', 'ins_ir_telescope', 'lv_sparrow', 'lv_kestrel', 'lv_leviathan', 'lv_rideshare', 'gs_dsn', 'l2', 'mars', 'lunar', 'heo', 'wildfire', 'cubesat_classroom', 'deep_sky', 'mars_orbiter', 'sandbox', 'lunar_relay'];
      const ids = new Set(items.map((i) => i.id));
      check('no deleted fictional ids remain in the data', old.every((id) => !ids.has(id)), old.filter((id) => ids.has(id)).join(', '));
      check('exactly three missions: comms ★, weather ★★, navigation ★★★', SCENARIOS.map((s) => `${s.id}:${s.stars}`).join() === `${C}:1,${W}:2,${N}:3`);
      check('events are game rates only (no probability field shown as statistics)', EVENTS.every((e) => typeof e.perYear === 'number' && !('probability' in e)));
    }

    // ═══ 2. BOM sums, budgets, bundles ═════════════════════════════════════════
    section('2 · Research BOM sums, cost tables, bundles');
    for (const [sid, kgParts, kgChecked, hw, budget, reserve] of [[C, 7.55, 8.68, 1.36, 6.00, 0.59], [W, 8.60, 9.89, 5.54, 18.00, 2.61], [N, 700, 700, 112, 280, 20]]) {
      const st = make(sid);
      const r = computeResources(st);
      check(`${sid}: parts ${kgParts} kg → checked ${kgChecked} kg`, near(r.mass.parts, kgParts) && near(r.mass.used, kgChecked, 0.006), `${r.mass.parts} → ${r.mass.used}`);
      check(`${sid}: hardware $${hw}M`, near(r.budget.hardware, hw), `$${r.budget.hardware}M`);
      check(`${sid}: all budget lines + planned reserve = $${budget}M`, near(r.budget.used + reserve, budget) && near(r.budget.reserveLeft, reserve) && r.budget.status === 'ok', `used ${r.budget.used} + reserve ${r.budget.reserveLeft}`);
    }
    {
      const n = computeResources(make(N));
      check('navigation: 700 kg already includes 110 kg propellant — no extra 15%', n.mass.reserve === 0 && n.mass.propellant === 110 && n.mass.used === 700);
      check('6U: 15% design reserve is applied (§8.1)', near(computeResources(make(C)).mass.reserve, 1.1325) && near(computeResources(make(W)).mass.reserve, 1.29));
      for (const p of POWER_PACKS) {
        const manual = Object.values(p.parts).map(getComponent).filter(Boolean);
        const tot = bundleTotals(p.parts, C);
        check(`power pack ${p.id}: mass/cost = sum of parts`, near(tot.mass, manual.reduce((a, c) => a + c.mass, 0)) && near(tot.cost, manual.reduce((a, c) => a + costFor(c, C), 0)), `${tot.mass} kg, $${tot.cost}M`);
      }
      for (const [sid, kit] of Object.entries(KITS[0].byMission)) {
        const parts = Object.values(kit).map(getComponent).filter(Boolean);
        const tot = bundleTotals(kit, sid);
        check(`standard kit (${sid}): mass/cost = sum of its research parts`, near(tot.mass, parts.reduce((a, c) => a + c.mass, 0)) && near(tot.cost, parts.reduce((a, c) => a + costFor(c, sid), 0)), `${tot.mass.toFixed(2)} kg, $${tot.cost.toFixed(2)}M`);
      }
      check('UHF TT&C costs $0.05M in the comms build and $0.06M in the weather build', costFor(getComponent('ttc_uhf'), C) === 0.05 && costFor(getComponent('ttc_uhf'), W) === 0.06);
    }

    // ═══ 3. Power, battery, data (§8.2, §8.4) ══════════════════════════════════
    section('3 · Power, battery and data formulas');
    {
      const c = computeResources(make(C));
      check('comms: 38.4 W × 0.60 × 0.80 = 18.43 W available vs 15 W load', near(c.power.available, 18.432) && c.power.used === 15 && near(c.power.margin, 1 - 15 / 18.432), `${c.power.available} W, margin ${(c.power.margin * 100).toFixed(1)}%`);
      check('comms: battery 60 Wh × 0.6 = 36 Wh usable vs 15 W × 35/60 h = 8.75 Wh', near(c.battery.available, 36) && near(c.battery.used, 8.75));
      const w = computeResources(make(W));
      check('weather: 38.4 W × 0.67 × 0.80 = 20.6 W available vs 17 W load', near(w.power.available, 20.6, 0.03) && w.power.used === 17, `${w.power.available} W`);
      check('weather: 80 Wh × 0.6 = 48 Wh usable vs 17 W × 35/60 h = 9.92 Wh', near(w.battery.available, 48) && near(w.battery.used, 9.92, 0.005), `${w.battery.used} Wh`);
      check('weather data: 5 Mbps × 1 h × 3600 / 8 / 1000 = 2.25 GB/day (theoretical) vs 2 GB/day made', near(w.data.available, 2.25) && w.data.used === 2 && w.data.lostFraction === 0);
      check('IoT is judged as a packet chain, not GB/day', c.data.kind === 'packets' && c.data.chainOk && c.data.used == null);
      const n = computeResources(make(N));
      check('navigation is not judged by GB/day; 1.1 kW avg & 1.5 kW peak vs 1.6 kW array', n.data.kind === 'nav' && n.data.chainOk && n.power.used === 1100 && n.power.peak === 1500 && n.power.peakOk && n.power.available === 1600);
      check('MEO has no single eclipse value: battery is checked present, not with an invented number', n.battery.needWh == null && n.battery.status === 'ok');
      check('lifetime: no "thrusters add years" bonus — plan comes from the mission', computeResources(make(N)).lifetime.plannedMonths === 12 && computeResources(make(C)).lifetime.plannedMonths === 12 && computeResources(make(W)).lifetime.plannedMonths === 24);
    }

    // ═══ 4. QA cases §10 ═══════════════════════════════════════════════════════
    await tick();
    section('4 · Research §10 QA cases (hard gates before score)');
    const passCase = (id, st) => {
      const errs = errorsOf(st);
      const go = canLaunch(validateDesign(st));
      const s = sim(st);
      const objs = evaluateObjectives(st, s);
      check(`${id}: PASS (GO, all KPIs met)`, go && errs.length === 0 && satelliteSuccess(objs) && s.outcome === 'success', `${s.outcome}; ${errs.map((e) => e.message).join(' | ')}`);
      return s;
    };
    const failCase = (id, st, gates, msgRe = null) => {
      const errs = errorsOf(st);
      const got = gatesFailed(st);
      const ok = !canLaunch(validateDesign(st)) && gates.every((g) => got.includes(g)) && (!msgRe || msgRe.test(errs.map((e) => e.message).join(' ')));
      check(`${id}: FAIL via ${gates.join(' + ')}`, ok, errs.map((e) => e.message).join(' | ') || validateDesign(st).filter((i) => i.severity === 'todo').map((i) => i.message).join(' | '));
      check(`${id}: every failed gate says (a) requirement, (b) fixing card, (c) alternative-or-none`, errs.length > 0 && errs.every((e) => e.why && e.fix && 'alternative' in e));
    };
    {
      passCase('C-01 full IoT build, LEO 550, 6U, F9 rideshare', make(C));
      // C-02: control radio only — no IoT payload at all, then with only the antenna
      const c2 = make(C, (d) => ({ ...d, instrumentIds: [] }));
      check('C-02: only UHF TT&C, no IoT payload → NO-GO (payload gate open)', !canLaunch(validateDesign(c2)) && gateStatus(validateDesign(c2)).find((g) => g.id === 'mandatory_payload_complete').status !== 'pass');
      failCase('C-02b TT&C + antennas but no IoT transceiver', make(C, (d) => ({ ...d, instrumentIds: ['ant_iot_deploy'] })), ['mandatory_payload_complete'], /does not receive users' messages/);
      failCase('C-03 IoT 6U + GEO, same 38.4 W, rideshare to SSO', make(C, (d) => ({ ...d, orbitId: 'geo' })), ['orbit_service_compatible', 'launcher_trajectory_compatible', 'power_peak_and_average_pass']);
      const c4 = make(C, (d) => ({ ...d, instrumentIds: [...d.instrumentIds, 'payload_mw_radiometer', 'radiometer_calibration'] }));
      failCase(`C-04 IoT 6U over 12 kg through extra components (${computeResources(c4).mass.used.toFixed(2)} kg)`, c4, ['spacecraft_size_mass_volume_compatible'], /Too heavy for the CubeSat 6U dispenser/);
      const n1 = passCase('N-01 GNSS 700 kg + clocks/signal/ground + contracted MEO injection', make(N));
      check('N-01: PASS as a single spacecraft (satellite_success)', satelliteSuccess(evaluateObjectives(make(N), n1)));

    // ═══ 5. Valid alternatives & distractors ═══════════════════════════════════

      const cases = [

    // ═══ 7. Simulation ═════════════════════════════════════════════════════════
    await tick();
    section('7 · Simulation: seeded, replayable, no launch-failure roll');
    {
      const st = make(C);
      check('runSimulation is deterministic', JSON.stringify(runSimulation(st, 42, [], { autoChoice: 0 })) === JSON.stringify(runSimulation(st, 42, [], { autoChoice: 0 })));

      while (!runSimulation(st, seed).pending) seed++;
      let s = runSimulation(st, seed); let n = 0;

      check('step-by-step decisions replay identically to auto-resolve', JSON.stringify(s) === JSON.stringify({ ...auto, decisions: s.decisions }) && s.complete, `(seed ${seed}, ${n} decisions)`);
      let launched = 0, success = 0;

      check('ignoring faults and storms can lose the satellite (simulated damage)', lost > 0, `${lost}/300 lost`);
      check('pending run reports outcome "pending"', runSimulation(st, seed).outcome === 'pending');
    }

    // ═══ 8. Scoring, role goals, teamwork, sharing ═════════════════════════════
    await tick();
    section('8 · Scoring, role goals, votes, sharing, badges');
    {
      const nearly = (a, b) => Math.abs(a - b) < 1e-9;
      check('margin curve: 20% best, 0% risky, over = 0, 60% wasteful', nearly(marginQuality(0.2), 1) && nearly(marginQuality(0), 0.3) && nearly(marginQuality(-0.1), 0) && nearly(marginQuality(0.6), 0.5));
      const wt = weightsFor('team'); const ws = weightsFor('solo');

      check('team weights 35/25/15/15/10; "Mission performance" keeps 35%', nearly(sum(wt), 1) && nearly(wt.science, 0.35) && nearly(wt.teamwork, 0.1));

        const st = make(sid); const s = sim(st); const sc = scoreMission(st, s);
        check(`${sid}: score 0–1000 = sum of parts; Mission performance part present; disposal bonus +${DISPOSAL_BONUS}`, sc.total <= 1000 && sc.total === Math.min(1000, sc.parts.reduce((a, p) => a + p.points, 0)) && sc.parts.some((p) => p.label === 'Mission performance') && sc.parts.find((p) => p.id === 'disposal').points === DISPOSAL_BONUS, `${sc.total} ${sc.grade}`);

      team = run(team, A.castVote('scientist', 'nogo', 'science'), A.castVote('flight', 'go'));
      check('3 Go + 1 reasoned No-Go → majority, launch allowed', voteStatus(team).majority && reducer(team, A.runSimulation(1)).simulation != null);
      const allGo = run(team, A.castVote('scientist', 'go'));

      check('team score has a teamwork part with the unanimous bonus', ts.votes.unanimous && ts.parts.find((p) => p.id === 'teamwork').points === 100);
      const st = make(W);

      check('share link round-trips the design (incl. adapter + launch prep)', JSON.stringify(loaded.design.components) === JSON.stringify(st.design.components) && loaded.design.deployerId === 'dep_cubesat' && loaded.design.prep.disposal === true && loaded.screen === 'finalCheck');
      const bad = reducer(createInitialState(), A.loadDesign({ scenarioId: W, design: { components: { structure: 'nope', power: 'str_6u' }, instrumentIds: ['payload_mw_radiometer', 'zzz'], orbitId: 'pluto' } }));
      check('a tampered link drops unknown ids', bad.design.components.structure === null && bad.design.components.power === null && bad.design.instrumentIds.join() === 'payload_mw_radiometer' && bad.design.orbitId === null);

      check('5 badges evaluated; a correct solo weather run earns "Every Bit Home", not "Perfect Team"', b.length === BADGES.length && b.find((x) => x.id === 'zero_data').earned && !b.find((x) => x.id === 'perfect_team').earned);

    // ═══ 9. Pure animation helpers ═══════════════════════════════════════════

    // ═══ 10. More real options (docs/OPTIONS_RESEARCH.md) ═════════════════════
    await tick();
    section('10 · More options: several PASS builds, thresholds, unknown values, reference builds');
    const ref = (sid, refId, extra = {}) => make(sid, (d) => ({ ...d, components: { ...emptyDesign().components, structure: refId, eol: d.components.eol ?? null }, instrumentIds: [], ...extra }));
    const variant = (st, v) => ({ ...st, design: { ...st.design, variantId: v } });
    const go = (st) => canLaunch(validateDesign(st));
    const passes = (label, st) => {
      const s = sim(st);
      const ok = go(st) && s.outcome === 'success' && satelliteSuccess(evaluateObjectives(st, s));

    };
    {
      // ── Builds per mission × objective variant (≥2 each) — straight from the data (scenarios.js variants[].builds)

      };
      for (const sc of SCENARIOS) {

      }
      const weatherBuilds = { hurricanes: [[null, fromBuild(W, SCENARIOS.find((x) => x.id === W).variants[1].builds[0])]] };
      const wxRadar12u = fromBuild(W, SCENARIOS.find((x) => x.id === W).variants[2].builds[1]);

      check('a sub-optimal variant fit lowers only the Mission performance part', sSub.parts.find((p) => p.id === 'science').points < sBest.parts.find((p) => p.id === 'science').points
        && ['objectives', 'efficiency', 'survivability'].every((id) => sSub.parts.find((p) => p.id === id).points === sBest.parts.find((p) => p.id === id).points) && sSub.outcome === 'success');

      // ── Battery thresholds (real EnduroSat EPS numbers vs the research 8.75 Wh need)
      const eps1 = computeResources(make(C, withParts({ battery: 'bat_eps1' })));
      check('EPS I (10.2 Wh): 6.12 Wh usable < 8.75 Wh needed → battery gate FAIL', near(eps1.battery.available, 6.12) && gatesFailed(make(C, withParts({ battery: 'bat_eps1' }))).includes('battery_eclipse_pass'));
      const eps1p = computeResources(make(C, withParts({ battery: 'bat_eps1plus' })));
      check('EPS I+ (20.4 Wh): 12.24 Wh usable ≥ 8.75 (comms) and ≥ 9.92 (weather) → passes thinly', near(eps1p.battery.available, 12.24) && go(make(C, withParts({ battery: 'bat_eps1plus' }))) && go(make(W, withParts({ battery: 'bat_eps1plus' }))));
      const eps2 = computeResources(make(C, withParts({ battery: 'bat_eps2' })));
      check('EPS II (84 Wh): 50.4 Wh usable — big margin, +0.98 kg vs EPS I+ (before reserve)', near(eps2.battery.available, 50.4) && near(eps2.mass.parts - eps1p.mass.parts, 0.982) && go(make(C, withParts({ battery: 'bat_eps2' }))));

      // ── Solar thresholds
      const fixedC = computeResources(make(C, withParts({ power: 'pwr_6u_fixed' })));
      check('6U fixed panel: 19.2 × 0.60 × 0.80 = 9.22 W < 15 W comms load → power gate FAIL', near(fixedC.power.available, 9.216) && gatesFailed(make(C, withParts({ power: 'pwr_6u_fixed' }))).includes('power_peak_and_average_pass'));
      check('6U deployable wings: 38.4 W → 18.43 W average → comms GO', go(make(C, withParts({ power: 'pwr_6u_deploy' }))));
      const radarFixed = make(W, (d) => ({ ...d, components: { ...d.components, structure: 'str_cube_12u', power: 'pwr_6u_fixed' }, instrumentIds: ['wx_raincube_radar'] }));
      check('RainCube radar (22 W) on a 19.2 W fixed panel → NO-GO even in full sunlight', errorsOf(radarFixed).some((e) => /needs 22 W; array gives 19.2 W/.test(e.message)) && /40 min/.test(errorsOf(radarFixed).find((e) => /22 W/.test(e.message))?.why ?? ''), errorsOf(radarFixed).map((e) => e.message).join(' | '));
      check('RainCube radar on deployable wings runs in bursts (duty cycle) → GO', go(wxRadar12u) && computeResources(wxRadar12u).power.payloadPeakOk === true);
      check('the radar-power event (real RainCube story) can only happen with a radar', EVENTS.find((e) => e.id === 'radar_power').requiresRole === 'precip_radar');
      check('3U deployable wings do not fit a 6U frame', gatesFailed(make(C, withParts({ power: 'pwr_3u_deploy' }))).includes('spacecraft_size_mass_volume_compatible'));

      // ── Unknown prices → uncertain budget (amber, not a fail, never a guess)
      const nb = make(C, (d) => ({ ...d, instrumentIds: ['iot_nbiot_ntn', 'ant_iot_deploy'] }));
      const nbRes = computeResources(nb);
      check('NOT PUBLIC price → budget "uncertain" (not over, not guessed); RFQ caution; still GO', nbRes.budget.uncertain && nbRes.budget.unknownItems.includes('5G NB-IoT NTN') && nbRes.budget.status !== 'over'
        && validateDesign(nb).some((i) => i.severity === 'caution' && /Budget uncertain/.test(i.message)) && go(nb));
      const nbScore = scoreMission(nb, sim(nb));
      check('uncertain budget: cost efficiency uses known items only; results say "request a quote (RFQ)"', /request a quote/.test(nbScore.parts.find((p) => p.id === 'efficiency').why) && nbScore.stats.budgetUncertain);
      check('≈ estimate: the NB-IoT radio uses the research SDR class mass (1.50 kg), shown as estimated', near(nbRes.mass.parts, 7.55) && nbRes.mass.estimated.includes('iot_nbiot_ntn'));
      const iss = computeResources(make(C, (d) => ({ ...d, orbitId: 'iss_400_516', launcherId: 'lv_iss_deploy' })));
      check('NOT PUBLIC renders as unknown — never as 0 (ISS launch line is null, not $0)', iss.budget.lines.find((l) => l.id === 'launch').value === null && iss.budget.uncertain);
      const el = computeResources(make(C, (d) => ({ ...d, launcherId: 'lv_electron_kickstage' })));
      check('📰 Electron reported ~$7.5M is counted: comms goes over its $6M model budget (warning, not NO-GO)', near(el.budget.launch, 7.5) && el.budget.status === 'over' && go(make(C, (d) => ({ ...d, launcherId: 'lv_electron_kickstage' }))));

      // ── Reference builds: real total mass instead of part-by-part mass
      const tr = computeResources(ref(W, 'ref_tropics_3u'));
      check('TROPICS reference build: real total 5.4 kg, no extra 15%, checked against the 3U 6 kg limit', tr.mass.used === 5.4 && tr.mass.reserve === 0 && tr.mass.available === 6 && tr.mass.status === 'ok');
      check('RainCube reference build: 12 kg — exactly at the 6U limit (tight, but GO)', computeResources(ref(W, 'ref_raincube_6u')).mass.used === 12 && computeResources(ref(W, 'ref_raincube_6u')).mass.status === 'caution');
      check('GPS III reference build: 3,681 kg real launch mass', computeResources(gps).mass.used === 3681);
      const trParts = make(W, (d) => ({ ...d, components: { ...d.components, structure: 'str_cube_3u' }, instrumentIds: ['wx_tropics_radiometer'] }));
      const cv = errorsOf(trParts).find((e) => /cannot be verified/.test(e.message));
      check('TROPICS radiometer part by part: mass NOT PUBLIC → "cannot verify" NO-GO, offering the reference build', !!cv && /TROPICS 3U \(real\)/.test(cv.alternative ?? ''));
      check('6U XL frame (mass not public) → cannot verify; drag sail (mass not public) → cannot verify', errorsOf(make(C, withParts({ structure: 'str_es_6u_xl' }))).some((e) => /cannot be verified/.test(e.message)) && errorsOf(make(C, withParts({ eol: 'eol_drag_sail' }))).some((e) => /cannot be verified/.test(e.message)));
      check('a reference build is complete: extra payload → NO-GO', errorsOf(ref(C, 'ref_sateliot_6u', { instrumentIds: ['payload_iot_sdr'] })).some((e) => /is complete/.test(e.message)));
      check('a reference build for another mission → NO-GO', gatesFailed(ref(C, 'ref_tropics_3u')).includes('spacecraft_size_mass_volume_compatible'));
      check('laser retroreflector on the Galileo part build: mass NOT PUBLIC → cannot verify (it only flew inside GPS III)', errorsOf(make(N, (d) => ({ ...d, instrumentIds: [...d.instrumentIds, 'nav_lra'] }))).some((e) => /cannot be verified/.test(e.message)));
      check('Swarm: licensing caution (FCC refused the first licence in 2017)', validateDesign(ref(C, 'ref_swarm_spacebee')).some((i) => /hard to track/.test(i.message)));

      // ── Launch pairs, X-band, reuse, CIRAS
      check('2 Galileo satellites per launch halve the launch cost per satellite ($90M → $45M)', near(computeResources(make(N)).budget.launch, 90) && near(computeResources(make(N, (d) => ({ ...d, satsPerLaunch: 2 }))).budget.launch, 45));
      const xb = make(W, withParts({ downlink: 'dl_es_xband_tx' }));
      check('X-band transmitter: "overkill" caution with an X-band ground note — not a fail', validateDesign(xb).some((i) => i.severity === 'caution' && /overkill/.test(i.message)) && !gatesFailed(xb).includes('communications_link_pass'));
      check('reusing the S-band transceiver as downlink needs it as the control radio', gatesFailed(make(C, withParts({ downlink: 'dl_reuse_sband_trx' }))).includes('communications_link_pass') && go(make(C, withParts({ comms: 'ttc_es_sband_trx', downlink: 'dl_reuse_sband_trx' }))));
      check('CIRAS (cancelled) → NO-GO with an honest reason', errorsOf(make(W, (d) => ({ ...d, instrumentIds: ['wx_ciras_ir', ...d.instrumentIds] }))).some((e) => /cancelled/.test(e.message)));
      check('GNSS-RO needs no calibration module (but its mass is not public → cannot verify)', !payloadNeeds(getSelection(make(W, (d) => ({ ...d, instrumentIds: ['wx_gnss_ro'] })))).needed.includes('calibration'));
      passes('weather with an OBC-with-GNSS replacing the sun/orbit sensors', make(W, withParts({ computer: 'obc_es_gnss', sensors: 'none' })));
      check('research radiometer + Electron to 32°: over the $18M budget (real consequence, objective fails — not a NO-GO)', go(make(W, (d) => ({ ...d, orbitId: 'leo_550_32deg', launcherId: 'lv_electron_kickstage' }))) && computeResources(make(W, (d) => ({ ...d, orbitId: 'leo_550_32deg', launcherId: 'lv_electron_kickstage' }))).budget.status === 'over');
    }

    const summary = document.getElementById('summary');
    summary.textContent = `${pass} passed, ${fail} failed`;
    summary.className = `summary ${fail ? 'fail' : 'pass'}`;
    document.title = fail ? `FAIL (${fail}) — Mission Control Self-Test` : 'PASS — Mission Control Self-Test';
  </script>
</body>
</html>
