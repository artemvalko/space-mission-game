<body data-screen="start">
  <header class="topbar">
    <button class="brand" type="button" id="brand" aria-label="Back to the start screen">
      <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">
        <circle cx="16" cy="16" r="7" fill="var(--accent)"/>
        <ellipse cx="16" cy="16" rx="14" ry="5" fill="none" stroke="var(--text)" stroke-width="2" transform="rotate(-20 16 16)"/>
      </svg>
      <span class="brand-name">Mission Control</span>
    </button>
    <div id="header-actions" class="header-actions"></div>
  </header>

  <section id="goal-strip" class="goal-strip" aria-label="Mission goal"></section>
  <nav id="step-list" class="step-list" aria-label="Steps"></nav>

  <div class="layout">
    <main id="screen" class="main"></main>
    <aside id="sidebar" class="sidebar" aria-label="Your satellite and gauges"></aside>
  </div>

  <noscript>This game needs JavaScript. Serve the folder with <code>python3 -m http.server</code>.</noscript>
